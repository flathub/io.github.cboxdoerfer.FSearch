app-id: io.github.cboxdoerfer.FSearch
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: fsearch
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Needs to find files everywhere
  - --filesystem=host
cleanup:
  - /share/man
modules:
  - name: fsearch
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dchannel=flathub-stable
    sources:
      - type: git
        url: https://github.com/cboxdoerfer/fsearch.git
        tag: 0.3.2
        commit: 6d119c034410516cfb2104108fc96d1c29a7b222

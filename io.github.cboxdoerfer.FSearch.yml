app-id: io.github.cboxdoerfer.FSearch
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fsearch
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Needs to find files everywhere
  - --filesystem=host
cleanup:
  - /share/man
modules:
  - name: fsearch
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dchannel=flathub-stable
    sources:
      - type: git
        url: https://github.com/cboxdoerfer/fsearch.git
        tag: 0.2.3
        commit: 0ff26877e1b6d6b84d0e5021f221c69f86f95259
      - type: patch
        path: fix-appdata.patch
